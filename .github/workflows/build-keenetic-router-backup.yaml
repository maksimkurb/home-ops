---
name: Build Keenetic Router Backup
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "containers/keenetic-router-backup/**"
      - ".github/workflows/build-keenetic-router-backup.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate image version
        id: version
        shell: bash
        run: echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: containers/keenetic-router-backup
          file: containers/keenetic-router-backup/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/keenetic-router-backup:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/keenetic-router-backup:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/keenetic-router-backup:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/keenetic-router-backup:latest" >> "$GITHUB_STEP_SUMMARY"
