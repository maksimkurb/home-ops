---
name: Helm Release Differ
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "cluster/**.yaml"
env:
  # Currently no way to detect automatically
  DEFAULT_BRANCH: main
  # Author of the diff comments (the BOT_APP_ID GitHub App)
  BOT_USERNAME: "homeops-gh-bot[bot]"
jobs:
  detect-file-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            yaml:
              - added|modified: "**/helm-release.yaml"
    outputs:
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
  helm-release-differ:
    name: Helm Release Differ
    runs-on: ubuntu-latest
    needs: detect-file-changes
    if: ${{ needs.detect-file-changes.outputs.yaml_files != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.detect-file-changes.outputs.yaml_files) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate Token
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: "${{ env.DEFAULT_BRANCH }}"
          path: default
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Helm Release Differ
        id: diff
        run: |
          diff=$(.github/scripts/helm-release-differ.sh --source-file "default/${{ matrix.file }}" --target-file "${{ matrix.file }}" --remove-common-labels)
          echo "${diff}"
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "diff<<${delimiter}"
            echo "${diff}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: "${{ github.event.pull_request.number }}"
          comment-author: "${{ env.BOT_USERNAME }}"
          body-includes: "${{ matrix.file }}"
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: "${{ steps.generate-token.outputs.token }}"
          comment-id: "${{ steps.find-comment.outputs.comment-id }}"
          issue-number: "${{ github.event.pull_request.number }}"
          body: "${{ steps.diff.outputs.diff }}"
          edit-mode: replace
