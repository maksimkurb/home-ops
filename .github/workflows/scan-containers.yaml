---
name: Scan Containers
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "cluster/**.yaml"
      - "ansible/**.yml.j2"
permissions:
  contents: read
  # trivy pulls private ghcr.io/maksimkurb/* images with GITHUB_TOKEN
  packages: read
  security-events: write
jobs:
  detect-file-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            yaml:
              - added|modified: "**.yaml"
              - added|modified: "**.yml"
              - added|modified: "**.yaml.j2"
              - added|modified: "**.yml.j2"
    outputs:
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
  # One job for all files: outputs of matrix jobs overwrite each other, so a
  # per-file matrix only ever scanned the images of whichever job finished last.
  detect-containers:
    name: Detect Containers
    runs-on: ubuntu-latest
    needs: detect-file-changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect Containers in Files
        id: containers
        env:
          FILES: ${{ needs.detect-file-changes.outputs.yaml_files }}
        run: |
          failed=0
          : > images.txt
          while IFS= read -r file; do
            [[ -f "${file}" ]] || continue
            if ! out=$(.github/scripts/container-parser.sh --file "${file}"); then
              echo "::error file=${file}::container detection failed"
              failed=1
              continue
            fi
            [[ -n "${out}" ]] || continue
            echo "${file}: ${out}"
            jq -r '.containers[]' <<< "${out}" >> images.txt
          done < <(jq -r '.[]' <<< "${FILES:-[]}")
          echo "containers=$(sort -u images.txt | jq -R . | jq -cs .)" >> "${GITHUB_OUTPUT}"
          exit "${failed}"
    outputs:
      containers: ${{ steps.containers.outputs.containers }}
  scan-containers:
    name: Scan Containers
    runs-on: ubuntu-latest
    needs: detect-containers
    # !cancelled(): still scan what was detected if one file failed to parse
    if: ${{ !cancelled() && needs.detect-containers.outputs.containers != '' && needs.detect-containers.outputs.containers != '[]' }}
    strategy:
      matrix:
        container: ${{ fromJSON(needs.detect-containers.outputs.containers) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Scoped to ghcr.io via docker config; TRIVY_USERNAME/PASSWORD would send
      # the token to every registry (docker.io, quay.io, ...).
      - name: Login to ghcr.io
        if: ${{ startsWith(matrix.container, 'ghcr.io/') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan Container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.container }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
