---
name: Build Wyoming GigaAM
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "containers/wyoming-gigaam/**"
      - ".github/workflows/build-wyoming-gigaam.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate image version
        id: version
        shell: bash
        run: echo "version=$(date -u +\'%Y%m%d%H%M%S\')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: containers/wyoming-gigaam
          file: containers/wyoming-gigaam/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wyoming-gigaam:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/wyoming-gigaam:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/wyoming-gigaam:${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/wyoming-gigaam:latest" >> "$GITHUB_STEP_SUMMARY"
