---
- name: Install iperf3 on Ubuntu
  ansible.builtin.apt:
    name: iperf3
    state: present
    update_cache: true
  become: true
  tags:
    - iperf3
    - iperf3-server
- name: Deploy iperf3 systemd service
  ansible.builtin.template:
    src: iperf3.service.j2
    dest: /etc/systemd/system/iperf3.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Reload systemd
    - Restart iperf3
  tags:
    - iperf3
    - iperf3-server
- name: Enable and start iperf3 service
  ansible.builtin.systemd:
    name: iperf3
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags:
    - iperf3
    - iperf3-server
- name: Check if UFW is installed
  ansible.builtin.command: which ufw
  register: iperf3_ufw_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - iperf3
    - iperf3-server
- name: Allow iperf3 server port in UFW
  community.general.ufw:
    rule: allow
    port: "{{ iperf3_server_port | string }}"
    proto: any
    comment: iperf3
  become: true
  when: iperf3_ufw_check.rc == 0
  tags:
    - iperf3
    - iperf3-server
