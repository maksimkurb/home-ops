---
easytier_enabled: true
easytier_version: "2.7.1"
# auto-detected: debian | openwrt | entware (override in host_vars)
easytier_platform: ""
# auto-detected from ansible_architecture; override for routers (mips vs mipsel!)
# values: x86_64 aarch64 armv7 armv7hf arm armhf mips mipsel riscv64
easytier_arch: ""

# The node is fully managed from the easytier-web panel (network, IP, peers,
# listeners, proxied subnets). Only the config-server URL lives here (sops):
#   wss://et.cubly.ru/<user-token>
easytier_config_server: ""
# Configs received from the panel are stored here and loaded on start, so the
# node comes up with its last known config while the panel is unreachable.
# Default: /etc/easytier/configs (Debian, OpenWrt), /opt/etc/easytier/configs (Entware)
easytier_config_dir: ""
# Fixed machine UUID the panel uses to recognise this device and restore its
# config. Empty: Debian/Entware derive it from the system
# (~/.local/share/easytier/machine_id), OpenWrt LuCI generates
# /etc/easytier/et_machine_id on first start.
easytier_machine_id: ""
# Device name shown in the panel
easytier_hostname: "{{ inventory_hostname }}"
# warn | info | debug | trace | off (OpenWrt LuCI log level)
easytier_log_level: warn

easytier_enable_ip_forward: false # Debian
easytier_firewall_zone: easytier # OpenWrt
easytier_tun_device: tun0 # OpenWrt firewall zone device

# Listener ports configured in the panel that must be reachable from outside:
# opened in ufw (Debian/Ubuntu, if ufw is active) or on the OpenWrt wan zone.
# e.g. ["tcp/11010", "udp/11010"]
easytier_open_ports: []
easytier_manage_firewall: true
easytier_wan_zone: wan # OpenWrt

# OpenWrt: official easytier-noweb + luci-app-easytier packages
# luci-app-easytier publishes bundles only for some releases (no v2.6.3, v2.7.x),
# so the bundle (luci UI + init script) is pinned to the newest one that exists.
# easytier-core/easytier-cli are then replaced with easytier_version from the
# main EasyTier release.
easytier_luci_version: "2.6.4"
