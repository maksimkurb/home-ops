---
- name: Set paths
  ansible.builtin.set_fact:
    easytier_bin_dir: /usr/local/bin
- name: Config dir
  ansible.builtin.file: {path: /etc/easytier, state: directory, mode: "0700"}
- name: Set aside the cached panel configs if easytier-core is not easytier_version
  # A core of another version may have written fields this version refuses to parse
  # (e.g. source = "webhook") and would crash-loop; the panel resends the config on connect.
  ansible.builtin.shell: |
    cur=$({{ easytier_bin_dir }}/easytier-core -V 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -n1)
    [ -z "$cur" ] && exit 0
    case "$cur" in "{{ easytier_version }}"|"{{ easytier_version }}"-*) exit 0;; esac
    ls {{ easytier_config_dir_r }}/*.toml >/dev/null 2>&1 || exit 0
    bak="{{ easytier_config_dir_r }}.bak-$cur-$(date +%s)"
    mkdir -p "$bak" && mv {{ easytier_config_dir_r }}/*.toml "$bak"/
    echo "changed: moved to $bak"
  register: easytier_cfg_cache
  changed_when: "'changed' in easytier_cfg_cache.stdout"
  notify: Restart easytier
- name: Binaries
  ansible.builtin.include_tasks: fetch.yaml
- name: Remove the old local TOML config
  ansible.builtin.file: {path: /etc/easytier/config.toml, state: absent}
- name: Dir for configs received from the panel
  ansible.builtin.file: {path: "{{ easytier_config_dir_r }}", state: directory, mode: "0700"}
- name: Config-server URL (environment file, keeps the token out of the unit)
  ansible.builtin.template:
    src: easytier.env.j2
    dest: /etc/easytier/easytier.env
    mode: "0600"
  no_log: true
  notify: Restart easytier
- name: Enable ip_forward
  ansible.posix.sysctl: {name: net.ipv4.ip_forward, value: "1", sysctl_file: /etc/sysctl.d/99-easytier.conf}
  when: easytier_enable_ip_forward | bool
- name: Open listener ports in ufw (if ufw is active)
  ansible.builtin.shell: |
    set -o pipefail
    command -v ufw >/dev/null 2>&1 || exit 0
    ufw status | grep '^Status: active' >/dev/null || exit 0
    rule="{{ item.split('/')[1] }}/{{ item.split('/')[0] }}"
    ufw status | grep -E "^$rule +ALLOW" >/dev/null && exit 0
    ufw allow "$rule" comment 'easytier' >/dev/null && echo changed
  register: easytier_ufw
  changed_when: "'changed' in easytier_ufw.stdout"
  loop: "{{ easytier_open_ports }}"
  when: easytier_manage_firewall | bool
- name: Install systemd unit
  ansible.builtin.template: {src: easytier.service.j2, dest: /etc/systemd/system/easytier.service, mode: "0644"}
  notify: Restart easytier
- name: Enable and start
  ansible.builtin.systemd: {name: easytier, enabled: true, state: started, daemon_reload: true}
