---
- name: Set paths
  ansible.builtin.set_fact:
    easytier_bin_dir: /usr/bin
- name: Ensure kmod-tun
  ansible.builtin.shell: |
    if command -v apk >/dev/null 2>&1; then apk info -e kmod-tun >/dev/null || apk add kmod-tun
    else opkg list-installed | grep -q '^kmod-tun ' || { opkg update && opkg install kmod-tun; }; fi
  changed_when: false
- name: Config dir
  ansible.builtin.file: {path: /etc/easytier, state: directory, mode: "0700"}
- name: Binaries (plain binary mode)
  ansible.builtin.include_tasks: fetch.yaml
  when: not easytier_openwrt_luci | bool
- name: Packages (easytier + luci-app-easytier)
  ansible.builtin.include_tasks: openwrt-luci-packages.yaml
  when: easytier_openwrt_luci | bool
- name: Config
  ansible.builtin.template: {src: config.toml.j2, dest: /etc/easytier/config.toml, mode: "0600"}
  when: easytier_web_url | length == 0
  no_log: true
  notify: Restart easytier
- name: Command line
  ansible.builtin.set_fact:
    easytier_cmdline: "{{ '-w ' ~ easytier_web_url ~ ' --hostname ' ~ easytier_hostname if easytier_web_url | length else '-c /etc/easytier/config.toml' }}"
- name: procd init script (plain binary mode)
  ansible.builtin.template: {src: easytier.procd.j2, dest: /etc/init.d/easytier, mode: "0755"}
  when: not easytier_openwrt_luci | bool
  notify: Restart easytier
- name: Configure the LuCI package (run from our TOML or easytier-web, we own network and firewall)
  ansible.builtin.shell: |
    set -e
    c=easytier.@easytier[0]
    uci -q get easytier.@easytier[0] >/dev/null || uci add easytier easytier >/dev/null
    want() { [ "$(uci -q get $c.$1)" = "$2" ] || { uci set $c.$1="$2"; ch=1; }; }
    want enabled 1
    want etcmd '{{ 'web' if easytier_web_url | length else 'config' }}'
    want auto_config_interface 0
    want auto_config_firewall 0
    {{ ("want web_config '" ~ easytier_web_url ~ "'") if easytier_web_url | length else ':' }}
    {{ ("want desvice_name '" ~ easytier_hostname ~ "'") if easytier_web_url | length else ':' }}
    [ -z "$ch" ] || { uci commit easytier; echo changed; }
  register: easytier_uci
  changed_when: "'changed' in easytier_uci.stdout"
  when: easytier_openwrt_luci | bool
  notify: Restart easytier
- name: Firewall zone, forwarding to/from lan, allow input from the overlay
  ansible.builtin.shell: |
    set -e
    uci -q get firewall.{{ easytier_firewall_zone }} >/dev/null && exit 0
    uci set firewall.{{ easytier_firewall_zone }}=zone
    uci set firewall.{{ easytier_firewall_zone }}.name='{{ easytier_firewall_zone }}'
    uci set firewall.{{ easytier_firewall_zone }}.device='tun0'
    uci set firewall.{{ easytier_firewall_zone }}.input='ACCEPT'
    uci set firewall.{{ easytier_firewall_zone }}.output='ACCEPT'
    uci set firewall.{{ easytier_firewall_zone }}.forward='ACCEPT'
    uci set firewall.{{ easytier_firewall_zone }}.masq='0'
    for d in "lan:{{ easytier_firewall_zone }}" "{{ easytier_firewall_zone }}:lan"; do
      n="et_${d%%:*}_${d##*:}"
      uci set firewall.$n=forwarding
      uci set firewall.$n.src="${d%%:*}"
      uci set firewall.$n.dest="${d##*:}"
    done
    uci commit firewall
    /etc/init.d/firewall reload
    echo changed
  register: easytier_fw
  changed_when: "'changed' in easytier_fw.stdout"
- name: Allow listener ports on the wan zone
  ansible.builtin.shell: |
    set -e
    n="easytier_{{ item.proto }}_{{ item.port }}"
    uci -q get firewall.$n >/dev/null && exit 0
    uci set firewall.$n=rule
    uci set firewall.$n.name='Allow-EasyTier-{{ item.proto }}-{{ item.port }}'
    uci set firewall.$n.src='{{ easytier_wan_zone }}'
    uci set firewall.$n.proto='{{ item.proto }}'
    uci set firewall.$n.dest_port='{{ item.port }}'
    uci set firewall.$n.target='ACCEPT'
    uci commit firewall
    /etc/init.d/firewall reload
    echo changed
  register: easytier_wanfw
  changed_when: "'changed' in easytier_wanfw.stdout"
  loop: "{{ easytier_listen_rules | default([]) }}"
  when: easytier_manage_firewall | bool
- name: Enable and start
  ansible.builtin.shell: /etc/init.d/easytier enable && /etc/init.d/easytier start
  changed_when: false
