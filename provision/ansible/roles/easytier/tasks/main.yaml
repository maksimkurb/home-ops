---
- name: Skip hosts where EasyTier is not managed
  ansible.builtin.meta: end_host
  when: not (easytier_enabled | bool)
  tags: [easytier]

- name: Detect OpenWrt
  ansible.builtin.stat: {path: /etc/openwrt_release}
  register: easytier_st_owrt
  tags: [easytier]
- name: Detect Entware
  ansible.builtin.stat: {path: /opt/bin/opkg}
  register: easytier_st_entware
  tags: [easytier]

- name: Resolve platform and arch
  ansible.builtin.set_fact:
    easytier_platform_r: >-
      {{ easytier_platform if easytier_platform | length else
         ('openwrt' if easytier_st_owrt.stat.exists else
          ('entware' if easytier_st_entware.stat.exists else 'debian')) }}
    easytier_arch_r: >-
      {{ easytier_arch if easytier_arch | length else
         {'x86_64': 'x86_64', 'aarch64': 'aarch64', 'armv7l': 'armv7',
          'armv6l': 'arm', 'mips': 'mips', 'mipsel': 'mipsel',
          'riscv64': 'riscv64'}[ansible_architecture] | default('') }}
  tags: [easytier]
- name: Resolve the config dir
  ansible.builtin.set_fact:
    easytier_config_dir_r: >-
      {{ easytier_config_dir if easytier_config_dir | length else
         ('/opt/etc/easytier/configs' if easytier_platform_r == 'entware' else '/etc/easytier/configs') }}
  tags: [easytier]

- name: Detect MIPS endianness from the package arch (ansible reports both as mips)
  ansible.builtin.shell: >-
    { opkg print-architecture 2>/dev/null; dpkg --print-architecture 2>/dev/null; }
    | grep -q mipsel && echo mipsel || echo mips
  register: easytier_elf_data
  changed_when: false
  check_mode: false
  when: easytier_arch | length == 0 and easytier_arch_r == 'mips'
  tags: [easytier]
- name: Use mipsel on little-endian MIPS
  ansible.builtin.set_fact:
    easytier_arch_r: mipsel
  when: easytier_elf_data.stdout is defined and easytier_elf_data.stdout | trim == 'mipsel'
  tags: [easytier]

- name: Check settings
  ansible.builtin.assert:
    that: "{{ item.that }}"
    fail_msg: "{{ inventory_hostname }}: {{ item.msg }}"
    quiet: true
  loop:
    - name: arch
      that: easytier_arch_r | length > 0 or easytier_platform_r == 'openwrt'
      msg: "arch not detected ({{ ansible_facts.architecture }}), set easytier_arch"
    - name: config_server
      that: easytier_config_server is match('^(udp|tcp|ws|wss)://.+/.+')
      msg: "easytier_config_server is empty or not a URL like wss://et.cubly.ru/<token>"
    - name: machine_id
      that: easytier_machine_id | length == 0 or easytier_machine_id is match('^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$')
      msg: "easytier_machine_id must be a UUID"
    - name: open_ports
      that: easytier_open_ports | reject('match', '^(tcp|udp)/[0-9]+$') | list | length == 0
      msg: "easytier_open_ports items must look like tcp/11010"
  loop_control: {label: "{{ item.name }}"}
  tags: [easytier]

- name: Install on {{ easytier_platform_r }}
  ansible.builtin.include_tasks: "install-{{ easytier_platform_r }}.yaml"
  tags: [easytier]
