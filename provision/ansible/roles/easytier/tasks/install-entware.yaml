---
- name: Set paths
  ansible.builtin.set_fact:
    easytier_bin_dir: /opt/bin
- name: Binaries
  ansible.builtin.include_tasks: fetch.yaml
- name: Config dir
  ansible.builtin.file: {path: /opt/etc/easytier, state: directory, mode: "0700"}
- name: Remove the old local TOML config
  ansible.builtin.file: {path: /opt/etc/easytier/config.toml, state: absent}
- name: Dir for configs received from the panel
  ansible.builtin.file: {path: "{{ easytier_config_dir_r }}", state: directory, mode: "0700"}
- name: init script
  ansible.builtin.template: {src: easytier.entware.j2, dest: /opt/etc/init.d/S60easytier, mode: "0700"}
  no_log: true
  notify: Restart easytier
- name: Start
  ansible.builtin.command: /opt/etc/init.d/S60easytier start
  changed_when: false
