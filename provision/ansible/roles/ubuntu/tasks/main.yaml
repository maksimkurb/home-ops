---
- name: Import locale tasks
  ansible.builtin.import_tasks: locale.yaml
  tags:
    - locale
- name: Import packages tasks
  ansible.builtin.import_tasks: packages.yaml
  tags:
    - packages
- name: Import network tasks
  ansible.builtin.import_tasks: network.yaml
  tags:
    - network
- name: Import filesystem tasks
  ansible.builtin.import_tasks: filesystem.yaml
  tags:
    - filesystem
- name: Import user tasks
  ansible.builtin.import_tasks: user.yaml
  tags:
    - user
- name: Import time tasks
  ansible.builtin.import_tasks: time.yaml
  tags:
    - time
- name: Import haproxy tasks
  ansible.builtin.import_tasks: haproxy.yaml
  tags:
    - haproxy
  when: ubuntu_haproxy_enabled | default(false)
