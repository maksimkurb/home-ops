---
- name: Detect OpenWrt (procd init scripts) vs systemd hosts
  ansible.builtin.stat:
    path: /etc/openwrt_release
  register: frpc_st_openwrt
  tags: [frpc]
- name: Set frpc_openwrt
  ansible.builtin.set_fact:
    frpc_openwrt: "{{ frpc_st_openwrt.stat.exists }}"
  tags: [frpc]
- name: Create download directory on the controller
  ansible.builtin.file:
    path: "{{ frpc_download_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  tags: [frpc]
- name: Download frp release on the controller
  ansible.builtin.get_url:
    url: "https://github.com/fatedier/frp/releases/download/v{{ frpc_version }}/frp_{{ frpc_version }}_linux_{{ frpc_arch }}.tar.gz"
    dest: "{{ frpc_download_dir }}/frp_{{ frpc_version }}_linux_{{ frpc_arch }}.tar.gz"
    checksum: "sha256:https://github.com/fatedier/frp/releases/download/v{{ frpc_version }}/frp_sha256_checksums.txt"
    mode: "0644"
  delegate_to: localhost
  become: false
  tags: [frpc]
- name: Unpack frp release on the controller
  ansible.builtin.unarchive:
    src: "{{ frpc_download_dir }}/frp_{{ frpc_version }}_linux_{{ frpc_arch }}.tar.gz"
    dest: "{{ frpc_download_dir }}"
    creates: "{{ frpc_download_dir }}/frp_{{ frpc_version }}_linux_{{ frpc_arch }}/frpc"
  delegate_to: localhost
  become: false
  tags: [frpc]
- name: Install frpc binary
  ansible.builtin.copy:
    src: "{{ frpc_download_dir }}/frp_{{ frpc_version }}_linux_{{ frpc_arch }}/frpc"
    dest: /usr/bin/frpc
    owner: root
    group: root
    mode: "0755"
  notify: Restart frpc
  tags: [frpc]
- name: Create /etc/frp
  ansible.builtin.file:
    path: /etc/frp
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [frpc]
- name: Deploy frpc configs
  ansible.builtin.template:
    src: frpc.toml.j2
    dest: "/etc/frp/{{ item.name }}.toml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart frpc
  no_log: true
  tags: [frpc]
- name: Deploy frpc init scripts
  ansible.builtin.template:
    src: frpc.init.j2
    dest: "/etc/init.d/frpc-{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart frpc
  when: frpc_openwrt
  tags: [frpc]
- name: Enable frpc services
  ansible.builtin.command:
    cmd: "/etc/init.d/frpc-{{ item.name }} enable"
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: frpc_openwrt
  tags: [frpc]
- name: Deploy frpc systemd units
  ansible.builtin.template:
    src: frpc.service.j2
    dest: "/etc/systemd/system/frpc-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: frpc_units
  notify: Restart frpc
  when: not frpc_openwrt
  tags: [frpc]
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not frpc_openwrt and frpc_units is changed
  tags: [frpc]
- name: Flush handlers before starting the services
  ansible.builtin.meta: flush_handlers
  tags: [frpc]
- name: Start frpc services
  ansible.builtin.command:
    cmd: "/etc/init.d/frpc-{{ item.name }} start"
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: frpc_start
  changed_when: false
  failed_when: frpc_start.rc != 0 and "already running" not in frpc_start.stderr
  when: frpc_openwrt
  tags: [frpc]
- name: Enable and start frpc services (systemd)
  ansible.builtin.systemd_service:
    name: "frpc-{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ frpc_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: not frpc_openwrt
  tags: [frpc]
