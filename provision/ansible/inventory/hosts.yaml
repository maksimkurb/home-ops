---
kubernetes:
  children:
    master:
      hosts:
        k3s-server: {}
    worker:
      hosts: {}
nvidia:
  hosts:
    k3s-server: {}
ubuntu:
  hosts:
    k3s-server: {}
reverse-proxy:
  hosts:
    vps-3: {}
vpn-server:
  hosts:
    vps-3: {}
    vps-4: {}
scrutiny-collector:
  hosts:
    pve: {}
iperf3-stats:
  hosts:
    # casa-sok:
    #   iperf3_client_enabled: true
    vps-a:
      iperf3_server_enabled: true
    vps-b:
      iperf3_server_enabled: true
    vps-c:
      iperf3_server_enabled: true
    owrt-h1:
      iperf3_server_enabled: true
      iperf3_client_enabled: true
    owrt-h3:
      iperf3_client_enabled: true
      #casa-sok:
      #  iperf3_server_enabled: false
      #  iperf3_client_enabled: true
# frp: reverse tunnels (OpenWrt frpc -> VPS frps)
frp:
  children:
    frps:
      hosts:
        vps-c: {}
    frpc:
      hosts:
        owrt-h1: {}
        owrt-h3: {}
        owrt-tkh2: {}

# headscale: control plane, DERP relays and tailnet clients
headscale:
  hosts:
    vps-c: {}
derp:
  hosts:
    vps-c: {}
pubproxy:
  hosts:
    vps-c: {}
tailscale:
  hosts:
    vps-c: {}
    owrt-h1: {}
    owrt-h3: {}
# easytier: mesh nodes (Debian/OpenWrt/Entware)
easytier:
  hosts:
    vps-c: {}
    owrt-h1: {}
    owrt-h3: {}
# netbird_relay: NetBird relay + STUN on a public VPS
netbird_relay:
  hosts:
    vps-c: {}
# netbird: clients (Debian/Ubuntu, OpenWrt, Keenetic Entware); set netbird_platform: keenetic in host_vars
netbird:
  hosts:
    owrt-h1: {}
    owrt-h3: {}

