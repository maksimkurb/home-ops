---
version: "3"
env:
  ANSIBLE_CONFIG: "{{.PROJECT_DIR}}/ansible.cfg"
vars:
  ANSIBLE_PLAYBOOK_DIR: "{{.ANSIBLE_DIR}}/playbooks"
  ANSIBLE_INVENTORY_DIR: "{{.ANSIBLE_DIR}}/inventory"
tasks:
  deps:
    desc: Upgrade Ansible galaxy deps
    dir: provision/ansible
    cmds:
      - "ansible-galaxy install -r requirements.yaml --force"
  list:
    desc: List all the hosts
    dir: provision/ansible
    cmds:
      - "ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --list-hosts {{ .CLI_ARGS }}"
  playbook:reverse-proxy-install:
    desc: Install reverse proxy
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/reverse-proxy-install.yaml {{ .CLI_ARGS }}"
  playbook:frps-install:
    desc: Install frp server (frps) on Ubuntu
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/frps-install.yaml {{ .CLI_ARGS }}"
  playbook:frpc-install:
    desc: Install frp client (frpc) on OpenWrt
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/frpc-install.yaml {{ .CLI_ARGS }}"
  playbook:headscale-install:
    desc: Install Headscale control server
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/headscale-install.yaml {{ .CLI_ARGS }}"
  playbook:derp-install:
    desc: Install DERP relays (derper) for Headscale
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/derp-install.yaml {{ .CLI_ARGS }}"
  playbook:pubproxy-install:
    desc: Install wildcard TLS proxy for published apps (pubproxy)
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/pubproxy-install.yaml {{ .CLI_ARGS }}"
  playbook:tailscale-install:
    desc: Install Tailscale client (Debian/Ubuntu/OpenWrt/Keenetic) and join Headscale
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/tailscale-install.yaml {{ .CLI_ARGS }}"
  playbook:netbird-install:
    desc: Install NetBird client (Debian/Ubuntu/OpenWrt/Keenetic) and join the network
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/netbird-install.yaml {{ .CLI_ARGS }}"
  playbook:easytier-install:
    desc: Install EasyTier on Debian/OpenWrt/Entware nodes
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/easytier-install.yaml {{ .CLI_ARGS }}"
  playbook:tailscale-uninstall:
    desc: Remove tailscale from routers and servers (and node records in headscale)
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/tailscale-uninstall.yaml {{ .CLI_ARGS }}"
  playbook:headscale-uninstall:
    desc: Remove DERP, headscale and pubproxy from charlie (data is archived first)
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/headscale-uninstall.yaml {{ .CLI_ARGS }}"
  playbook:netbird-relay-install:
    desc: Install the NetBird relay and STUN server (built from source) on the relay hosts
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/netbird-relay-install.yaml {{ .CLI_ARGS }}"
  playbook:iperf3-stats-install:
    desc: Configure iperf3 Statistics Collection
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/iperf3-stats-install.yaml {{ .CLI_ARGS }}"
  playbook:scrutiny-collector-install:
    desc: Install Scrutiny Collector for disk monitoring
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/scrutiny-collector-install.yaml {{ .CLI_ARGS }}"
  playbook:cctv-install:
    desc: Prepare CCTV node
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/cctv-install.yaml {{ .CLI_ARGS }}"
  playbook:ubuntu-prepare:
    desc: Prepare all the k8s nodes for running k3s
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/ubuntu-prepare.yaml {{ .CLI_ARGS }}"
  playbook:ubuntu-upgrade:
    desc: Upgrade all the k8s nodes operating system
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/ubuntu-upgrade.yaml {{ .CLI_ARGS }}"
  playbook:k3s-install:
    desc: Install Kubernetes on the nodes
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/k3s-install.yaml {{ .CLI_ARGS }}"
  playbook:nvidia-ctr-install:
    desc: Install Kubernetes on the nodes
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/nvidia-ctr-install.yaml {{ .CLI_ARGS }}"
  playbook:k3s-nuke:
    desc: Uninstall Kubernetes on the nodes
    dir: provision/ansible
    cmds:
      - "ansible-playbook -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml {{.ANSIBLE_PLAYBOOK_DIR}}/k3s-nuke.yaml {{ .CLI_ARGS }}"
  adhoc:ping:
    desc: Ping all the hosts
    dir: provision/ansible
    cmds:
      - "ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --one-line -m 'ping'"
  adhoc:uptime:
    desc: Uptime all hosts
    dir: provision/ansible
    cmds:
      - ansible all -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml --one-line -a 'uptime'
  adhoc:reboot:
    desc: Reboot all the k8s nodes
    dir: provision/ansible
    cmds:
      - "ansible kubernetes -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml -a '/usr/bin/systemctl reboot' --become"
  adhoc:poweroff:
    desc: Shutdown all the k8s nodes
    dir: provision/ansible
    cmds:
      - "ansible kubernetes -i {{.ANSIBLE_INVENTORY_DIR}}/hosts.yaml -a '/usr/bin/systemctl poweroff' --become"
