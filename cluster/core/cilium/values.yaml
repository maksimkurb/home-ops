kubeProxyReplacement: true
k8sServiceHost: "10.75.40.21"
k8sServicePort: 6443

ipam:
  mode: kubernetes

cni:
  exclusive: true
  uninstall: false

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 10
  burst: 20

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - httpV2
      - icmp
      - tcp
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
