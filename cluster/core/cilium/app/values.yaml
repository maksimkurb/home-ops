kubeProxyReplacement: true
k8sServiceHost: "10.75.40.21"
k8sServicePort: 6443

ipam:
  mode: kubernetes

cni:
  exclusive: true
  uninstall: false

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 10
  burst: 20

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: true
      className: nginx-intra
      annotations:
        # ForwardAuth start
        nginx.ingress.kubernetes.io/auth-method: GET
        nginx.ingress.kubernetes.io/auth-url: |-
          http://authelia.security.svc.cluster.local:8000/api/verify
        nginx.ingress.kubernetes.io/auth-signin: |-
          https://auth.${SECRET_PUBLIC_DOMAIN}?rm=$request_method
        nginx.ingress.kubernetes.io/auth-response-headers: |-
          Remote-User,Remote-Name,Remote-Groups,Remote-Email
        nginx.ingress.kubernetes.io/auth-snippet: |
          proxy_set_header X-Forwarded-Method $request_method;
        # ForwardAuth end
      hosts:
        - "hubble.${SECRET_PRIVATE_DOMAIN}"
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - httpV2
      - icmp
      - tcp
    serviceMonitor:
      enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
