---
kubeProxyReplacement: true
k8sServiceHost: 10.75.40.21
k8sServicePort: 6443
ipam:
  mode: kubernetes
cni:
  exclusive: true
  uninstall: false
operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
    ingress:
      enabled: false
      className: traefik-private
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure-private
        traefik.ingress.kubernetes.io/router.middlewares: networking_authelia@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls: 'true'
      hosts:
        - hubble.${SECRET_PRIVATE_DOMAIN}
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - httpV2
      - icmp
      - tcp
    serviceMonitor:
      enabled: true
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
