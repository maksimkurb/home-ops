---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: traefik-crds-source
  namespace: flux-system
spec:
  interval: 12h
  ref:
    tag: v41.6.0
  ignore: |
    /*
    !/traefik/crds
  url: https://github.com/traefik/traefik-helm-chart.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-crds
  namespace: flux-system
spec:
  interval: 12h
  path: ./traefik/crds
  prune: false
  sourceRef:
    kind: GitRepository
    name: traefik-crds-source
  wait: true
