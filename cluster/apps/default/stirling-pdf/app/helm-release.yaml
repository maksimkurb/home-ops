---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
    timeout: 15m0s
  upgrade:
    remediation:
      retries: 5
    timeout: 15m0s
  values:
    global:
      nameOverride: ${APP}
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - '{{ .Release.Name }}.${SECRET_PUBLIC_DOMAIN}'
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 8080
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: oidc-documents
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Tools
          gethomepage.dev/icon: /icons/stirling-pdf/${HOMEPAGE_ICONS_COLOR}
          gethomepage.dev/name: Stirling PDF
    persistence:
      config:
        enabled: true
        existingClaim: ${APP}-config
        globalMounts:
          - path: /configs
      logs:
        enabled: true
        type: emptyDir
      tmp:
        enabled: true
        type: emptyDir
      tessdata:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /usr/share/tessdata
    defaultPodOptions:
      securityContext:
        supplementalGroups:
          - 777
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/stirling-tools/s-pdf
              tag: 2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396
            env:
              TZ: ${TIMEZONE}
              DOCKER_ENABLE_SECURITY: 'false'
              SECURITY_ENABLE_LOGIN: 'true'
              INSTALL_BOOK_AND_ADVANCED_HTML_OPS: 'false'
              DISABLE_ADDITIONAL_FEATURES: 'true'
              SYSTEM_ENABLEANALYTICS: 'false'
              SYSTEM_ENABLEPOSTHOG: 'false'
              SYSTEM_ENABLESCARF: 'false'
            resources:
              requests:
                cpu: 1m
                memory: 1Gi
              limits:
                memory: 2Gi
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /api/v1/info/status
              readiness: *probe
              startup:
                !!merge <<: *probe
                spec:
                  failureThreshold: 90
                  periodSeconds: 5
