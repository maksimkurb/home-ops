---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./config-pvc.yaml
  - ./traefik.yaml
  - ./helm-release.yaml
configMapGenerator:
  - name: paperless-indra-init
    files:
      - 10-indra.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The script uses ${VAR} shell syntax; don't let Flux postBuild substitute it.
    kustomize.toolkit.fluxcd.io/substitute: disabled
