---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cublyverse
  namespace: default
spec:
  interval: 30m
  releaseName: *app
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      nameOverride: *app
    controllers:
      main:
        # One replica: Telegram long polling allows a single poller per bot
        # token. Recreate keeps two pods from polling at once during upgrades.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/maksimkurb/cublyverse
              # Immutable image published from main by .github/workflows/image.yml
              # in the cublyverse repo; bump to the new `sha-*` tag on upgrade.
              tag: sha-0b0d5ad
            # The app reads one DATABASE_URL; assemble it from the credentials
            # generated by the Zalando operator. $PGUSER/$PGPASSWORD are
            # deliberately brace-less: Flux would substitute ${PGUSER}.
            command:
              - /bin/sh
              - -c
            args:
              - |
                export DATABASE_URL="postgres://$PGUSER:$PGPASSWORD@homelab-pgsql.database.svc.cluster.local:5432/cublyverse"
                exec cublyverse serve
            envFrom:
              - secretRef:
                  name: cublyverse-secret
            env:
              TZ: ${TIMEZONE}
              HTTP_ADDR: ':8080'
              LOG_FORMAT: json
              PUBLIC_BASE_URL: https://verse.${SECRET_PUBLIC_DOMAIN}
              OIDC_ISSUER: https://auth.${SECRET_PUBLIC_DOMAIN}
              OIDC_CLIENT_ID: cublyverse
              OIDC_CLIENT_SECRET: ${SECRET_CUBLYVERSE_OAUTH_CLIENT_SECRET}
              OIDC_REDIRECT_URL: https://verse.${SECRET_PUBLIC_DOMAIN}/auth/callback
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: default.cublyverse.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: username
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: default.cublyverse.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: password
            probes:
              # Liveness must not depend on the database: /healthz only checks
              # the process, /readyz also pings PostgreSQL.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8080
                  periodSeconds: 15
                  failureThreshold: 3
              # Migrations run on startup, so allow a longer first start.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              allowPrivilegeEscalation: false
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - verse.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 8080
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Personal Services
          gethomepage.dev/icon: mdi-bell-ring
          gethomepage.dev/name: Cublyverse
          gethomepage.dev/href: https://verse.${SECRET_PUBLIC_DOMAIN}
