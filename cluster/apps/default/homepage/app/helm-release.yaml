---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: 'true'
        serviceAccount:
          identifier: homepage
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.4.0
            env:
              - name: HOMEPAGE_ALLOWED_HOSTS
                value: start.${SECRET_PUBLIC_DOMAIN},homepage-app.default:3000
              - name: LOG_TARGETS
                value: stdout
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 512Mi
          icons:
            image:
              repository: ghcr.io/selfhst/icons
              tag: 4.0.3
            env:
              - name: PORT
                value: 4050
              - name: ICON_SOURCE
                value: local
              - name: STANDARD_ICON_FORMAT
                value: svg
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 64Mi
      icons-update:
        type: cronjob
        cronjob:
          schedule: "0 0 * * 0"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          fix-icons-permissions:
            image:
              repository: alpine
              tag: 3.24.2
            securityContext:
              runAsUser: 0
              runAsGroup: 0
            command:
              - chown
              - -R
              - 777:777
              - /icons
        containers:
          sync:
            image:
              repository: alpine/git
              tag: v2.54.0
            command:
              - /bin/sh
              - -c
            args:
              - >-
                if [ -d /icons/.git ]; then git -c safe.directory=/icons -C /icons sparse-checkout set --no-cone svg && git -c safe.directory=/icons -C /icons pull --ff-only; else git clone --depth=1 --filter=blob:none --sparse https://github.com/selfhst/icons.git /icons && git -C /icons sparse-checkout set --no-cone svg; fi
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: main
        ports:
          http:
            primary: true
            port: 3000
      icons:
        controller: main
        ports:
          http:
            primary: true
            port: 4050
    route:
      app:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - start.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 3000
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: oidc-people
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
      icons:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - start.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /icons
            backendRefs:
              - identifier: icons
                port: 4050
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: homepage-icons
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 777
        runAsGroup: 777
        fsGroup: 777
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      homepage: {}
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups:
                - ''
              resources:
                - namespaces
                - pods
                - nodes
              verbs:
                - get
                - list
            - apiGroups:
                - extensions
                - networking.k8s.io
              resources:
                - ingresses
              verbs:
                - get
                - list
            - apiGroups:
                - traefik.io
              resources:
                - ingressroutes
              verbs:
                - get
                - list
            - apiGroups:
                - gateway.networking.k8s.io
              resources:
                - httproutes
                - gateways
              verbs:
                - get
                - list
            - apiGroups:
                - metrics.k8s.io
              resources:
                - nodes
                - pods
              verbs:
                - get
                - list
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            kind: ClusterRole
            identifier: homepage
          subjects:
            - identifier: homepage
    persistence:
      config:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /app/config
      config-files:
        enabled: true
        type: configMap
        name: ${APP}-config
        defaultMode: 0555
        advancedMounts:
          main:
            app:
              - path: /app/config/custom.js
                subPath: custom.js
                readOnly: true
              - path: /app/config/custom.css
                subPath: custom.css
                readOnly: true
              - path: /app/config/bookmarks.yaml
                subPath: bookmarks.yaml
                readOnly: true
              - path: /app/config/docker.yaml
                subPath: docker.yaml
                readOnly: true
              - path: /app/config/kubernetes.yaml
                subPath: kubernetes.yaml
                readOnly: true
              - path: /app/config/services.yaml
                subPath: services.yaml
                readOnly: true
              - path: /app/config/settings.yaml
                subPath: settings.yaml
                readOnly: true
              - path: /app/config/widgets.yaml
                subPath: widgets.yaml
                readOnly: true
      icons:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Mi
        storageClass: local-path
        advancedMounts:
          main:
            icons:
              - path: /app/icons
                subPath: icons
          icons-update:
            fix-icons-permissions:
              - path: /icons
                subPath: icons
            sync:
              - path: /icons
                subPath: icons
