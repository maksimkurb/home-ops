---
# Credentials rendered from cluster-secrets by Flux postBuild substitution.
# Homepage substitutes {{HOMEPAGE_VAR_*}} from its env into settings and
# Kubernetes-discovered widget annotations, so the keys stay in this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-cluster-secrets
type: Opaque
stringData:
  HOMEPAGE_VAR_JELLYFIN_API_KEY: '${SECRET_HOMEPAGE_JELLYFIN_API_KEY}'
  HOMEPAGE_VAR_JELLYSEERR_API_KEY: '${SECRET_HOMEPAGE_JELLYSEERR_API_KEY}'
  HOMEPAGE_VAR_OPENWEATHERMAP_API_KEY: '${SECRET_HOMEPAGE_OPENWEATHERMAP_API_KEY}'
  HOMEPAGE_VAR_PAPERLESSNGX_API_KEY: '${SECRET_HOMEPAGE_PAPERLESSNGX_API_KEY}'
  HOMEPAGE_VAR_PROWLARR_API_KEY: '${SECRET_HOMEPAGE_PROWLARR_API_KEY}'
  HOMEPAGE_VAR_QBITTORRENT_PASSWORD: '${SECRET_HOMEPAGE_QBITTORRENT_PASSWORD}'
  HOMEPAGE_VAR_QBITTORRENT_USERNAME: '${SECRET_HOMEPAGE_QBITTORRENT_USERNAME}'
  HOMEPAGE_VAR_RADARR_API_KEY: '${SECRET_HOMEPAGE_RADARR_API_KEY}'
  HOMEPAGE_VAR_SONARR_API_KEY: '${SECRET_HOMEPAGE_SONARR_API_KEY}'
