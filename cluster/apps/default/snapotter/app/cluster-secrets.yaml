---
# Credentials rendered from cluster-secrets by Flux postBuild substitution.
# They live in a Secret (not inlined in ConfigMaps/HelmRelease values), so
# read access to non-Secret resources does not expose them.
apiVersion: v1
kind: Secret
metadata:
  name: snapotter-cluster-secrets
type: Opaque
stringData:
  SECRET_SNAPOTTER_COOKIE_SECRET: '${SECRET_SNAPOTTER_COOKIE_SECRET}'
  SECRET_SNAPOTTER_DEFAULT_PASSWORD: '${SECRET_SNAPOTTER_DEFAULT_PASSWORD}'
