---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
    timeout: 15m0s
  upgrade:
    remediation:
      retries: 5
    timeout: 15m0s
  values:
    global:
      nameOverride: ${APP}
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 1349
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - snapotter.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 1349
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: oidc-people
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Tools
          gethomepage.dev/icon: mdi-image-edit
          gethomepage.dev/name: SnapOtter
    persistence:
      data:
        enabled: true
        existingClaim: snapotter-data
        advancedMounts:
          main:
            main:
              - path: /data
      workspace:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /tmp/workspace
      redis-data:
        enabled: true
        type: emptyDir
        advancedMounts:
          redis:
            redis:
              - path: /data
    defaultPodOptions:
      securityContext:
        runAsUser: 777
        runAsGroup: 777
        fsGroup: 777
        supplementalGroups:
          - 777
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          main:
            image:
              repository: ghcr.io/snapotter-hq/snapotter
              tag: 2.2.0
            command:
              - /bin/sh
              - -c
            args:
              - >-
                export DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@homelab-pgsql.database.svc.cluster.local:5432/snapotter"; exec entrypoint.sh ./node_modules/.bin/tsx --import ./src/tracing.ts --import ./src/instrument.ts src/index.ts
            env:
              TZ: ${TIMEZONE}
              AUTH_ENABLED: 'true'
              ANALYTICS_ENABLED: 'false'
              TRUST_PROXY: 'true'
              RATE_LIMIT_PER_MIN: '100'
              DEFAULT_USERNAME: admin
              DEFAULT_PASSWORD: ${SECRET_SNAPOTTER_DEFAULT_PASSWORD}
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: default.snapotter.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: username
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: default.snapotter.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: password
              REDIS_URL: redis://snapotter-redis:6379
              FILES_STORAGE_PATH: /data/files
              WORKSPACE_PATH: /tmp/workspace
              EXTERNAL_URL: https://snapotter.${SECRET_PUBLIC_DOMAIN}
              COOKIE_SECRET: ${SECRET_SNAPOTTER_COOKIE_SECRET}
              OIDC_ENABLED: 'true'
              OIDC_ISSUER_URL: https://auth.${SECRET_PUBLIC_DOMAIN}
              OIDC_CLIENT_ID: snapotter
              OIDC_CLIENT_SECRET: ${SECRET_SNAPOTTER_OAUTH_CLIENT_SECRET}
              OIDC_PROVIDER_NAME: Authelia
              OIDC_SCOPES: openid profile email
              OIDC_AUTO_CREATE_USERS: 'true'
              OIDC_AUTO_LINK_USERS: 'true'
              OIDC_DEFAULT_ROLE: user
              OIDC_USERNAME_CLAIM: preferred_username
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /api/v1/health
              readiness: *probe
              startup:
                !!merge <<: *probe
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
      redis:
        containers:
          redis:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.2
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
