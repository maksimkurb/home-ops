---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          server:
            image:
              repository: ghcr.io/maksimkurb/openwrt-asu
              tag: latest
              pullPolicy: Always
            command:
              - uv
              - run
              - uvicorn
              - --host
              - 0.0.0.0
              - --port
              - "8000"
              - asu.main:app
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
          worker:
            image:
              repository: ghcr.io/maksimkurb/openwrt-asu
              tag: latest
              pullPolicy: Always
            command:
              - uv
              - run
              - rqworker
              - --logging_level
              - INFO
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
          redis:
            image:
              repository: docker.io/redis
              tag: 8.10-alpine
            command:
              - redis-server
              - --save
              - ""
              - --appendonly
              - "no"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
          podman:
            image:
              repository: quay.io/podman/stable
              tag: latest
            securityContext:
              privileged: true
            command:
              - /bin/sh
              - -ec
            args:
              - |
                mkdir -p /run/podman
                podman network inspect asu-build >/dev/null 2>&1 || podman network create asu-build
                exec podman system service --time=0 unix:///run/podman/podman.sock
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 6Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: true
        className: nginx-intra
        annotations:
          nginx.ingress.kubernetes.io/enable-cors: "true"
          nginx.ingress.kubernetes.io/cors-allow-origin: "*"
          nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, HEAD, OPTIONS"
          nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Accept, Origin, User-Agent"
        hosts:
          - host: asu.${SECRET_PRIVATE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
    persistence:
      config:
        type: configMap
        name: ${APP}-config
        advancedMounts:
          main:
            server:
              - path: /app/asu.toml
                subPath: asu.toml
                readOnly: true
            worker:
              - path: /app/asu.toml
                subPath: asu.toml
                readOnly: true
      store:
        existingClaim: ${APP}-store
        advancedMounts:
          main:
            server:
              - path: /public/store
            worker:
              - path: /public/store
      podman-socket:
        type: emptyDir
        advancedMounts:
          main:
            worker:
              - path: /var
            podman:
              - path: /run/podman
      podman-storage:
        existingClaim: ${APP}-podman
        advancedMounts:
          main:
            podman:
              - path: /var/lib/containers
