---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scanservjs
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      scanservjs:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: sbs20/scanservjs
              tag: release-v3.0.3
            command: [node, /usr/lib/scanservjs/server/server.js]
            env:
              TZ: ${TIMEZONE}
              LANG: C
              LC_ALL: C
            envFrom:
              - secretRef:
                  name: scanservjs-env
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsGroup: 777
              fsGroup: 777
              fsGroupChangePolicy: OnRootMismatch
              supplementalGroups: ['777']
              readOnlyRootFilesystem: true
    service:
      app:
        controller: scanservjs
        ports:
          http:
            port: 8080
    route:
      app:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - scanservjs.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 8080
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: oidc-documents
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Tools
          gethomepage.dev/icon: mdi-scanner
          gethomepage.dev/name: ScanServJS
    persistence:
      config:
        existingClaim: scanservjs-config
        advancedMounts:
          scanservjs:
            app:
              - path: /etc/scanservjs
      docs:
        existingClaim: scanservjs-docs
        advancedMounts:
          scanservjs:
            app:
              - path: /var/lib/scanservjs
      sane:
        enabled: true
        type: configMap
        name: scanservjs-sane
        globalMounts:
          - path: /etc/sane.d/net.conf
            subPath: net.conf
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
