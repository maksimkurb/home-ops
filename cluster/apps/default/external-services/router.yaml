---
apiVersion: v1
kind: Service
metadata:
  name: ext-svc-router-dashboard
  namespace: default
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-svc-router-dashboard
  namespace: default
subsets:
  - addresses:
      - ip: ${ROUTER_IP}
    ports:
      - port: 443
        name: https

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-svc-router-dashboard-outbound
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/enabled: 'true'
    external-dns.alpha.kubernetes.io/target: '${SECRET_ROUTER_OUTBOUND_IP}'
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
    nginx.ingress.kubernetes.io/upstream-vhost: "${ROUTER_IP}"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Origin "https://${ROUTER_IP}";
      proxy_set_header Referer "https://${ROUTER_IP}";
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Middleware
    gethomepage.dev/icon: mdi-router-wireless
    gethomepage.dev/name: Router
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=homepage" # Just to have something valid
spec:
  ingressClassName: nginx
  rules:
    - host: ${SECRET_ROUTER_OUTBOUND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ext-svc-router-dashboard
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-svc-router-dashboard-cloudflare
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/enabled: 'true'
    external-dns.alpha.kubernetes.io/target: '${SECRET_ROUTER_OUTBOUND_IP}'
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "false"
    nginx.ingress.kubernetes.io/upstream-vhost: "${ROUTER_IP}"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Origin "https://${ROUTER_IP}";
      proxy_set_header Referer "https://${ROUTER_IP}";
spec:
  ingressClassName: nginx
  rules:
    - host: ${SECRET_ROUTER_CLOUDFLARE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ext-svc-router-dashboard
                port:
                  number: 443
