---
apiVersion: v1
kind: Service
metadata:
  name: ext-svc-router-dashboard
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: default_router-insecure@kubernetescrd
    traefik.ingress.kubernetes.io/service.passhostheader: "false"
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ext-svc-router-dashboard
  namespace: default
subsets:
  - addresses:
      - ip: ${ROUTER_IP}
    ports:
      - port: 443
        name: https

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-svc-router-dashboard-outbound
  namespace: default
  annotations:
    external-dns.kubernetes.io/enabled: 'true'
    external-dns.kubernetes.io/target: '${SECRET_ROUTER_OUTBOUND_IP}'
    external-dns.kubernetes.io/cloudflare-proxied: 'false'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: router-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Middleware
    gethomepage.dev/icon: mdi-router-wireless
    gethomepage.dev/name: Router
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=homepage" # Just to have something valid
spec:
  ingressClassName: traefik
  rules:
    - host: ${SECRET_ROUTER_OUTBOUND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ext-svc-router-dashboard
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ext-svc-router-dashboard-cloudflare
  namespace: default
  annotations:
    external-dns.kubernetes.io/enabled: 'true'
    external-dns.kubernetes.io/target: '${SECRET_ROUTER_OUTBOUND_IP}'
    external-dns.kubernetes.io/cloudflare-proxied: 'true'
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: router-headers@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ${SECRET_ROUTER_CLOUDFLARE_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ext-svc-router-dashboard
                port:
                  number: 443
