---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: router
  namespace: default
spec:
  weighted:
    services:
      - name: ext-svc-router-dashboard
        port: 80
        scheme: http
        passHostHeader: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: router-headers
  namespace: default
spec:
  headers:
    customRequestHeaders:
      Host: "${ROUTER_IP}"
      Origin: "http://${ROUTER_IP}"
      Referer: "http://${ROUTER_IP}"
