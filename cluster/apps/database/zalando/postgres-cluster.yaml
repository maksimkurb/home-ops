---
apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: homelab-pgsql
  namespace: database
spec:
  teamId: "homelab"
  volume:
    size: 10Gi
    # storageClass: homelab-pgsql-data
    selector:
      matchLabels:
        pg-volume: homelab-pgsql-data
  numberOfInstances: 1
  allowedSourceRanges:
    - "0.0.0.0/0"
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #       - matchExpressions:
  #           - key: kubernetes.io/hostname
  #             operator: In
  #             values:
  #               - k3s-worker1
  resources:
    requests:
      cpu: 500m
      memory: 1000Mi
    limits:
      cpu: '2'
      memory: 2000Mi
  postgresql:
    version: "18"
    parameters:
      shared_preload_libraries: 'bg_mon,pg_stat_statements,pgextwlist,pg_auth_mon,set_user,vchord'
      max_connections: '256'
      max_replication_slots: '32'
      max_wal_size: '5GB'
      shared_buffers: '512MB'
      wal_compression: 'on'
      work_mem: '16MB'
      autovacuum_vacuum_scale_factor: '0.1'
      autovacuum_analyze_scale_factor: '0.05'
      autovacuum_vacuum_cost_limit: '1000'
      effective_io_concurrency: '200'
      random_page_cost: '1.2'
  users:
    operator:
      - superuser
      - createdb
    vaultwarden: []
    firefly: []
    homeassistant: []
    authelia: []
    sftpgo: []
    immich: []
    tianji: []
    paperless: []
    maybe_finance: []
    prowlarr: []
    sonarr: []
    radarr: []
    mumble: []
    teamspeak: []
    coturn: []
    n8n: []
    ml.mcpjungle: []
    beta9: []
    crowdsec: []
    lab: []
    gatus: []
    seerr: []
    messaging.mas: []
    messaging.synapse: []
    default.plik: []
    default.snapotter: []
    default.frappe: []
    games.openquester: []
    oxygen.remnawave: []
  databases:
    vaultwarden: vaultwarden
    firefly: firefly
    homeassistant: homeassistant
    authelia: authelia
    sftpgo: sftpgo
    immich: immich
    tianji: tianji
    paperless: paperless
    maybe_finance: maybe_finance
    prowlarr: prowlarr
    prowlarr_log: prowlarr
    sonarr: sonarr
    sonarr_log: sonarr
    radarr: radarr
    radarr_log: radarr
    mumble: mumble
    teamspeak: teamspeak
    coturn: coturn
    n8n: n8n
    mcpjungle: ml.mcpjungle
    beta9: beta9
    crowdsec: crowdsec
    lab: lab
    gatus: gatus
    seerr: seerr
    mas: messaging.mas
    synapse: messaging.synapse
    plik: default.plik
    snapotter: default.snapotter
    frappe: default.frappe
    openquester: games.openquester
    remnawave: oxygen.remnawave
  enableMasterLoadBalancer: true
  masterServiceAnnotations:
    metallb.io/loadBalancerIPs: "${SVC_DATABASE_ADDR}"
    lbipam.cilium.io/ips: "${SVC_DATABASE_ADDR}"
  enableConnectionPooler: false
  enableLogicalBackup: true
  # clone:
  #   cluster: "homelab-restore-pgsql"  # Inplace restore when having the same cluster name as the source
  #   uid: "08f22d43-b36d-4930-a888-3e5516a20a03"
  #   timestamp: "2024-02-27T18:00:00+04:00"  # timezone required (offset relative to UTC, see RFC 3339 section 5.6)
