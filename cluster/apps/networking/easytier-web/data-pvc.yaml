---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easytier-web-data-v1
  namespace: networking
  labels:
    app.kubernetes.io/name: &name easytier-web
    app.kubernetes.io/instance: *name
    snapshot.home.arpa/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
