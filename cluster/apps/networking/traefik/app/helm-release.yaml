---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: 41.5.0
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 5
  upgrade:
    crds: Skip
    remediation:
      retries: 5
  values:
    deployment:
      replicas: 1
    experimental:
      abortOnPluginFailure: true
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.4.5
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        enabled: true
        safeNaming: true
      kubernetesIngress:
        enabled: true
        ingressClass: nginx-intra
      kubernetesIngressNginx:
        allowSnippetAnnotations: true
        enabled: true
        httpEntryPoint: web
        httpsEntryPoint: websecure
        ingressClass: nginx
        ingressClassByName: true
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    ingressClass:
      enabled: false
    service:
      enabled: false
    ports:
      web:
        port: 8000
        expose:
          default: false
      websecure:
        port: 8443
        expose:
          default: false
        forwardedHeaders:
          trustedIPs:
            - ${SECRET_VPS_IPS}
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      web-intra:
        port: 9080
        exposedPort: 80
        expose:
          default: false
      websecure-intra:
        port: 9443
        exposedPort: 443
        expose:
          default: false
    additionalArguments:
      - --entrypoints.web.http.aliasheadersstrategy=reject
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.http.aliasheadersstrategy=reject
      - --entrypoints.websecure.http.middlewares=networking_crowdsec@kubernetescrd
      - --entrypoints.web-intra.http.aliasheadersstrategy=reject
      - --entrypoints.web-intra.http.redirections.entrypoint.to=websecure-intra
      - --entrypoints.web-intra.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure-intra.http.aliasheadersstrategy=reject
      - --entrypoints.websecure-intra.http.middlewares=networking_private-allowlist@kubernetescrd
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 500Mi
