---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: 42.2.0
      sourceRef:
        kind: HelmRepository
        name: traefik-charts
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 5
  upgrade:
    force: true
    crds: Skip
    remediation:
      retries: 5
  values:
    api:
      dashboard: true
    deployment:
      replicas: 1
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      additionalVolumes:
        - name: captcha
          configMap:
            name: traefik-captcha
    additionalVolumeMounts:
      - name: captcha
        mountPath: /captcha.html
        subPath: captcha.html
        readOnly: true
    experimental:
      abortOnPluginFailure: true
      plugins:
        crowdsec-bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.4.5
        traefik-oidc-auth:
          moduleName: github.com/sevensolutions/traefik-oidc-auth
          version: v0.21.0
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
        enabled: true
        safeNaming: true
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-public
      kubernetesGateway:
        enabled: true
        labelSelector: gatewayclass=public
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
      name: traefik-public
    ingressClass:
      enabled: false
    service:
      enabled: false
    ports:
      web:
        port: 8000
        expose:
          default: false
      websecure:
        port: 8443
        expose:
          default: false
        forwardedHeaders:
          trustedIPs: ${CLOUDFLARE_PROXIED_NETWORKS}
      web-private:
        port: 9080
        exposedPort: 80
        expose:
          default: false
      websecure-private:
        port: 9443
        exposedPort: 443
        expose:
          default: false
    additionalArguments:
      - --providers.kubernetesgateway.statusaddress.service.name=traefik-public
      - --providers.kubernetesgateway.statusaddress.service.namespace=networking
      - --entrypoints.web.http.aliasheadersstrategy=reject
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.http.aliasheadersstrategy=reject
      - --entrypoints.websecure.http.middlewares=networking_crowdsec@kubernetescrd
      - --entrypoints.web-private.http.aliasheadersstrategy=reject
      - --entrypoints.web-private.http.redirections.entrypoint.to=:443
      - --entrypoints.web-private.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure-private.http.aliasheadersstrategy=reject
      - --entrypoints.websecure-private.http.middlewares=networking_private-allowlist@kubernetescrd
    log:
      level: INFO
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
          names:
            User-Agent: keep
            Accept: keep
    metrics:
      prometheus:
        enabled: true
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 500Mi
