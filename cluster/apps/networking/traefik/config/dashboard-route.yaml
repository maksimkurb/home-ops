---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  annotations:
    external-dns.kubernetes.io/enabled: "true"
    external-dns.alpha.kubernetes.io/target: ${INGRESS_DIRECT}
spec:
  hostnames:
    - traefik.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    - name: public
      sectionName: websecure
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
          port: 80
