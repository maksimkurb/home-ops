---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  annotations:
    external-dns.kubernetes.io/enabled: 'true'
    external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
spec:
  hostnames:
    - traefik.${SECRET_PUBLIC_DOMAIN}
  parentRefs:
    - name: public
      sectionName: websecure-public
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oidc-admins
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-private
spec:
  hostnames:
    - traefik.${SECRET_PRIVATE_DOMAIN}
  parentRefs:
    - name: private
      sectionName: websecure-private
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oidc-admins
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
          port: 80
