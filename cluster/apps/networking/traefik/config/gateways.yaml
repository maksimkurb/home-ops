---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  annotations:
    external-dns.kubernetes.io/target: ${INGRESS_DIRECT}
spec:
  gatewayClassName: traefik-public
  listeners:
    - name: web-public
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure-public
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
spec:
  gatewayClassName: traefik-private
  listeners:
    - name: web-private
      protocol: HTTP
      port: 9080
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure-private
      protocol: HTTPS
      port: 9443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-tls
      allowedRoutes:
        namespaces:
          from: All
