---
# Credentials rendered from cluster-secrets by Flux postBuild substitution.
# They live in a Secret (not inlined in ConfigMaps/HelmRelease values), so
# read access to non-Secret resources does not expose them.
apiVersion: v1
kind: Secret
metadata:
  name: easyplane-cluster-secrets
type: Opaque
stringData:
  EASYPLANE_OIDC_PROVIDERS: '[{"id":"authelia","label":"Authelia","issuer":"https://auth.${SECRET_PUBLIC_DOMAIN}","clientId":"easyplane","clientSecret":"${SECRET_EASYPLANE_OAUTH_CLIENT_SECRET}","scopes":"openid email profile groups","roleClaim":"groups","adminGroups":["admins"],"memberGroups":["people"],"defaultRole":"viewer"}]'
