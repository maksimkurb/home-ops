---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # Source for the Bundle. Regenerate with: hack/update-trusted-ca-bundle.sh
  - name: trusted-ca-source
    namespace: kube-system
    files:
      - ca-certificates.crt
resources:
  - bundle.yaml
