---
# Credentials rendered from cluster-secrets by Flux postBuild substitution.
# They live in a Secret (not inlined in ConfigMaps/HelmRelease values), so
# read access to non-Secret resources does not expose them.
apiVersion: v1
kind: Secret
metadata:
  name: authelia-cluster-secrets
type: Opaque
stringData:
  SECRET_CROWDSEC_WEB_UI_OAUTH_CLIENT_SECRET: '${SECRET_CROWDSEC_WEB_UI_OAUTH_CLIENT_SECRET}'
  SECRET_CUBLYVERSE_OAUTH_CLIENT_SECRET: '${SECRET_CUBLYVERSE_OAUTH_CLIENT_SECRET}'
  SECRET_EASYPLANE_OAUTH_CLIENT_SECRET: '${SECRET_EASYPLANE_OAUTH_CLIENT_SECRET}'
  SECRET_ENVROUTER_OAUTH_CLIENT_SECRET: '${SECRET_ENVROUTER_OAUTH_CLIENT_SECRET}'
  SECRET_FRAPPE_OAUTH_CLIENT_SECRET: '${SECRET_FRAPPE_OAUTH_CLIENT_SECRET}'
  SECRET_GRAFANA_OAUTH_CLIENT_SECRET: '${SECRET_GRAFANA_OAUTH_CLIENT_SECRET}'
  SECRET_GRIST_OAUTH_CLIENT_SECRET: '${SECRET_GRIST_OAUTH_CLIENT_SECRET}'
  SECRET_HASS_OAUTH_CLIENT_SECRET: '${SECRET_HASS_OAUTH_CLIENT_SECRET}'
  SECRET_HOMARR_OAUTH_CLIENT_SECRET: '${SECRET_HOMARR_OAUTH_CLIENT_SECRET}'
  SECRET_IMMICH_OAUTH_CLIENT_SECRET: '${SECRET_IMMICH_OAUTH_CLIENT_SECRET}'
  SECRET_MCPHUB_OAUTH_CLIENT_SECRET: '${SECRET_MCPHUB_OAUTH_CLIENT_SECRET}'
  SECRET_NODERED_OAUTH_CLIENT_SECRET: '${SECRET_NODERED_OAUTH_CLIENT_SECRET}'
  SECRET_PAPERLESS_OAUTH_CLIENT_SECRET: '${SECRET_PAPERLESS_OAUTH_CLIENT_SECRET}'
  SECRET_PLIK_OAUTH_CLIENT_SECRET: '${SECRET_PLIK_OAUTH_CLIENT_SECRET}'
  SECRET_SFTPGO_OAUTH_CLIENT_SECRET: '${SECRET_SFTPGO_OAUTH_CLIENT_SECRET}'
  SECRET_SILO_OAUTH_CLIENT_SECRET: '${SECRET_SILO_OAUTH_CLIENT_SECRET}'
  SECRET_SMTP_PASSWORD: '${SECRET_SMTP_PASSWORD}'
