---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/ellite/wallos
              tag: 5.8.2
            env:
              TZ: ${TIMEZONE}
              OIDC_ENABLED: "true"
              OIDC_ISSUER: https://auth.${SECRET_PUBLIC_DOMAIN}
              OIDC_CLIENT_ID: wallos
              OIDC_PROVIDER_NAME: Authelia
              OIDC_AUTO_CREATE_USER: "true"
              OIDC_DISABLE_PASSWORD_LOGIN: "true"
              OIDC_REDIRECT_URL: https://wallos.${SECRET_PUBLIC_DOMAIN}/index.php
              OIDC_LOGOUT_URL: https://auth.${SECRET_PUBLIC_DOMAIN}/logout
              OIDC_SCOPES: openid email profile
              OIDC_REQUIRE_EMAIL_VERIFIED: "false"
              OIDC_USER_IDENTIFIER: sub
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-secret
                    key: OIDC_CLIENT_SECRET
              SSRF_ALLOWLIST: auth.${SECRET_PUBLIC_DOMAIN},unified-push.${SECRET_PUBLIC_DOMAIN},llama-cpp.ml:9931
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: health.php
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: health.php
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - ${APP}.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 80
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        advancedMounts:
          main:
            main:
              - path: /var/www/html/db
                subPath: db
              - path: /var/www/html/images/uploads/logos
                subPath: logos
    defaultPodOptions:
      automountServiceAccountToken: false
