---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  uninstall:
    keepHistory: false
  values:
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379

    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/openquester/open_quester_server
              tag: dev
            env:
              ENV: prod
              API_PORT: "3000"
              API_DOMAIN: "si.${SECRET_PUBLIC_DOMAIN}"
              CORS_ORIGINS: "https://si.${SECRET_PUBLIC_DOMAIN}"
              SOCKET_IO_CORS_ORIGINS: "https://si.${SECRET_PUBLIC_DOMAIN}"
              DB_TYPE: pg
              DB_HOST: homelab-pgsql.database.svc.cluster.local
              DB_PORT: "5432"
              DB_POOL_SIZE: "8"
              DB_NAME: openquester
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: games.openquester.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: username
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: games.openquester.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: password
              REDIS_HOST: "${APP}-redis"
              REDIS_PORT: "6379"
              REDIS_DB_NUMBER: "0"
              STORAGE_TYPE: s3
              STORAGE_NAME: minio
              S3_ENDPOINT: "https://s3.${SECRET_PUBLIC_DOMAIN}"
              S3_BUCKET: openquester
              S3_REGION: us-east-1
              S3_USE_SUB_DOMAIN_BUCKET_FORMAT: "false"
              STARTUP_RECOVERY_ENABLED: "true"
              LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
      redis:
        containers:
          redis:
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.1
            args:
              - valkey-server
              - --appendonly
              - "yes"
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

    persistence:
      redis:
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          redis:
            redis:
              - path: /data

    ingress:
      main:
        enabled: true
        className: nginx
        annotations:
          external-dns.alpha.kubernetes.io/enabled: "true"
          external-dns.alpha.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.alpha.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: "si.${SECRET_PUBLIC_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
