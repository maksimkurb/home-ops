---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 777
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            securityContext:
              privileged: true
            image:
              repository: mornedhels/icarus-server
              tag: dev-wine-staging@sha256:9a3c9de9bca0a79ed18ce5ff6166786390f87eb0fa950e9e3fac85d6e7c64492
              pullPolicy: IfNotPresent
            env:
              SERVER_NAME: "cubly server"
              SERVER_MAX_PLAYERS: "8"
              SERVER_PORT: "17777"
              SERVER_QUERYPORT: "27015"
              SERVER_IP: "${SVC_ICARUS_ADDR}"
              PUID: "777"
              PGID: "777"
              UPDATE_CRON: "*/30 * * * *"
              WINEDEBUG: "-all"
              DXVK_LOG_LEVEL: "none"
              VKD3D_DEBUG: "none"
            envFrom:
              - secretRef:
                  name: ${APP}-secret
            resources:
              requests:
                cpu: 2000m
                memory: 6Gi
              limits:
                memory: 10Gi

    service:
      main:
        controller: main
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: "${SVC_ICARUS_ADDR}"
        ports:
          game:
            port: 17777
            protocol: UDP
          query:
            port: 27015
            protocol: UDP

    persistence:
      ntsync:
        enabled: true
        type: hostPath
        hostPath: /dev/ntsync
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/ntsync
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 5Gi
        retain: true
        globalMounts:
          - path: /home/icarus/drive_c/icarus
      game:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: local-path
        size: 50Gi
        retain: true
        globalMounts:
          - path: /opt/icarus
