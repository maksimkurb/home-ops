---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: ml
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: 80
            targetPort: 9931
            protocol: TCP
    route:
      app-private:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: private
            sectionName: websecure-private
            namespace: networking
        hostnames:
          - llama-cpp.${SECRET_PRIVATE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 80
    persistence:
      download-script:
        enabled: true
        type: configMap
        name: ${APP}-download-model
        defaultMode: 0555
        globalMounts:
          - path: /scripts/download-model.sh
            subPath: download-model.sh
            readOnly: true
      models-preset:
        enabled: true
        type: configMap
        name: ${APP}-models
        globalMounts:
          - path: /config/models.ini
            subPath: models.ini
            readOnly: true
      models:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /models
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/custom-nvidia-gpu
                    operator: In
                    values:
                      - "true"
      runtimeClassName: nvidia
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          download-model:
            image:
              repository: curlimages/curl
              tag: 8.22.0
            command:
              - /scripts/download-model.sh
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          install-dartai:
            image:
              repository: alpine
              tag: "3.22"
            command:
              - /bin/sh
              - -ec
            args:
              - |
                version=0.2.0
                runtime=/models/dartai-${version}
                if [ ! -x "${runtime}/llama-server" ]; then
                  wget -O /tmp/dartai.tgz "https://github.com/ftoleedo/dartai/releases/download/v${version}/dartai-linux-x64-cuda12-${version}.tar.gz"
                  echo "d868c105f50bc0d7abc5eecd96d9d8c38905cb64a400e02a8ebea48a4d7852c4  /tmp/dartai.tgz" | sha256sum -c -
                  mkdir -p "${runtime}"
                  tar -xzf /tmp/dartai.tgz -C "${runtime}" --strip-components=1
                fi
                if [ ! -s /models/Ternary-Bonsai-1.7B-Q2_0.gguf ]; then
                  wget -O /models/Ternary-Bonsai-1.7B-Q2_0.gguf.tmp "https://huggingface.co/prism-ml/Ternary-Bonsai-1.7B-gguf/resolve/main/Ternary-Bonsai-1.7B-Q2_0.gguf"
                  echo "d97d94eb564590c9f0300e54d3f87bbbb25a78693d0ade9f6e177973dcb8228a  /models/Ternary-Bonsai-1.7B-Q2_0.gguf.tmp" | sha256sum -c -
                  mv /models/Ternary-Bonsai-1.7B-Q2_0.gguf.tmp /models/Ternary-Bonsai-1.7B-Q2_0.gguf
                fi
                # The old chat GGUF is no longer referenced; free PVC space for the DartAI runtime.\n                rm -f /models/Qwen3.5-2B-Q4_K_M.gguf\n                mkdir -p /models/dartai-home
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda
              pullPolicy: IfNotPresent
            env:
              HOME: /models/dartai-home
              LLAMA_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: LLAMA_API_KEY
            command:
              - /bin/sh
              - -ec
            args:
              - |
                export LD_LIBRARY_PATH="/models/dartai-0.2.0:${LD_LIBRARY_PATH:-}"
                exec /models/dartai-0.2.0/llama-server                   --host 0.0.0.0                   --port 9931                   --models-preset /config/models.ini                   --models-max 2                   --api-key "${LLAMA_API_KEY}"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9931
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: 4000m
                memory: 6Gi
                nvidia.com/gpu: "1"
