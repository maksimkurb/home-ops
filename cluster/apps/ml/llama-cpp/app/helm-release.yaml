---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: ml
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          http:
            port: 9931
            protocol: TCP
    route:
      app-private:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: private
            sectionName: websecure-private
            namespace: networking
        hostnames:
          - llama-cpp.${SECRET_PRIVATE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 9931
    persistence:
      download-script:
        enabled: true
        type: configMap
        name: ${APP}-download-model
        defaultMode: 0555
        globalMounts:
          - path: /scripts/download-model.sh
            subPath: download-model.sh
            readOnly: true
      models-preset:
        enabled: true
        type: configMap
        name: ${APP}-models
        globalMounts:
          - path: /config/models.ini
            subPath: models.ini
            readOnly: true
      models:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /models
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/custom-nvidia-gpu
                    operator: In
                    values:
                      - "true"
      runtimeClassName: nvidia
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          download-model:
            image:
              repository: curlimages/curl
              tag: 8.22.0
            command:
              - /scripts/download-model.sh
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-cuda
              pullPolicy: IfNotPresent
            env:
              LLAMA_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: LLAMA_API_KEY
            command:
              - /app/llama-server
            args:
              - --host
              - 0.0.0.0
              - --port
              - "9931"
              - --models-preset
              - /config/models.ini
              - --models-max
              - "2"
              - --sleep-idle-seconds
              - "300"
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 9931
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: 4000m
                memory: 6Gi
                nvidia.com/gpu: "1"
