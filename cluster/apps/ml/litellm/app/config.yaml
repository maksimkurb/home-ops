---
model_list:
  # Auto LLM: PC > Cluster
  - model_name: auto
    litellm_params:
      model: openai/${LLAMA_PC_CHAT_MODEL}
      api_base: http://${SECRET_MAX_PC_IP}:9931/v1
      api_key: os.environ/LLAMA_PC_API_KEY
      order: 1
      timeout: 600
      connect_timeout: 3
  - model_name: auto
    litellm_params:
      model: openai/qwen3.5-2b
      api_base: http://llama-cpp.ml.svc.cluster.local/v1
      api_key: os.environ/LLAMA_CLUSTER_API_KEY
      order: 2
      timeout: 600

  # Cluster Embedding
  - model_name: embedding
    litellm_params:
      model: openai/qwen3-embedding-0.6b
      api_base: http://llama-cpp.ml.svc.cluster.local/v1
      api_key: os.environ/LLAMA_CLUSTER_API_KEY
      timeout: 600
    model_info:
      mode: embedding

  # Cluster-only LLM
  - model_name: cluster
    litellm_params:
      model: openai/qwen3.5-2b
      api_base: http://llama-cpp.ml.svc.cluster.local/v1
      api_key: os.environ/LLAMA_CLUSTER_API_KEY
      timeout: 600

  # PC-only LLM
  - model_name: pc
    litellm_params:
      model: openai/${LLAMA_PC_CHAT_MODEL}
      api_base: http://${SECRET_MAX_PC_IP}:9931/v1
      api_key: os.environ/LLAMA_PC_API_KEY
      timeout: 600
      connect_timeout: 3

router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks: [session_affinity]
  deployment_affinity_ttl_seconds: 3600
  allowed_fails: 0
  cooldown_time: 15
  num_retries: 0

litellm_settings:
  turn_off_message_logging: true
  callbacks: custom_callbacks.backend_logger

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
