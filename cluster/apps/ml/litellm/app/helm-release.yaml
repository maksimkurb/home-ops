---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: ml
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.100.1
            args:
              - --config
              - /config/config.yaml
              - --host
              - 0.0.0.0
              - --port
              - '4000'
            env:
              LITELLM_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: LITELLM_MASTER_KEY
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ml.litellm.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: password
              DATABASE_URL: postgresql://ml.litellm:$(DATABASE_PASSWORD)@homelab-pgsql.database.svc.cluster.local:5432/litellm
              GENERIC_CLIENT_ID: litellm
              GENERIC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: OAUTH_CLIENT_SECRET
              GENERIC_AUTHORIZATION_ENDPOINT: https://auth.${SECRET_PUBLIC_DOMAIN}/api/oidc/authorization
              GENERIC_TOKEN_ENDPOINT: https://auth.${SECRET_PUBLIC_DOMAIN}/api/oidc/token
              GENERIC_USERINFO_ENDPOINT: https://auth.${SECRET_PUBLIC_DOMAIN}/api/oidc/userinfo
              GENERIC_SCOPE: openid profile email groups
              GENERIC_USER_ID_ATTRIBUTE: sub
              GENERIC_INCLUDE_TOKEN_CLAIMS: 'true'
              GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
              GENERIC_ROLE_MAPPINGS_ROLES: '{"proxy_admin": ["admins"]}'
              GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: internal_user
              PROXY_BASE_URL: https://litellm.${SECRET_PRIVATE_DOMAIN}
              LLAMA_PC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: LLAMA_PC_API_KEY
              LLAMA_CLUSTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: llama-cpp
                    key: LLAMA_API_KEY
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  periodSeconds: 10
                  timeoutSeconds: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  periodSeconds: 30
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    persistence:
      config:
        type: configMap
        name: ${APP}-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
          - path: /app/custom_callbacks.py
            subPath: custom_callbacks.py
            readOnly: true
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: 4000
    route:
      app-private:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: private
            sectionName: websecure-private
            namespace: networking
        hostnames:
          - litellm.${SECRET_PRIVATE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 80
