---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: ml
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: maximhq/bifrost
              tag: v2.2.6
            env:
              BIFROST_ADMIN_USERNAME: admin
              BIFROST_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bifrost
                    key: BIFROST_ADMIN_PASSWORD
              LLAMA_PC_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bifrost
                    key: LLAMA_PC_API_KEY
              LLAMA_CLUSTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: llama-cpp
                    key: LLAMA_API_KEY
              BIFROST_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bifrost
                    key: BIFROST_API_KEY
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Mi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /app/data
      config:
        type: configMap
        name: bifrost-config
        globalMounts:
          - path: /app/data/config.json
            subPath: config.json
            readOnly: true
    service:
      app:
        controller: app
        ports:
          http:
            port: 80
            targetPort: 8080
    route:
      app-private:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: private
            sectionName: websecure-private
            namespace: networking
        hostnames:
          - bifrost.${SECRET_PRIVATE_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 80
