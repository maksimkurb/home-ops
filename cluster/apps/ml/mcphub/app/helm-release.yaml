---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  labels:
    app.kubernetes.io/name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Mi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /data
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: 'true'
        containers:
          app:
            image:
              repository: samanhappy/mcphub
              tag: 1.0.41
              pullPolicy: IfNotPresent
            env:
              TZ: ${TIMEZONE_FAILSAFE}
              NODE_ENV: production
              PORT: '3000'
              USE_DB: 'true'
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ml.mcphub.homelab-pgsql.credentials.postgresql.acid.zalan.do
                    key: password
              DB_URL: postgresql://ml.mcphub:$(DATABASE_PASSWORD)@homelab-pgsql.database.svc.cluster.local:5432/mcphub
              BETTER_AUTH_ENABLED: 'true'
              BETTER_AUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: BETTER_AUTH_SECRET
              BETTER_AUTH_URL: https://mcphub.${SECRET_PUBLIC_DOMAIN}
              BETTER_AUTH_TRUSTED_ORIGINS: https://mcphub.${SECRET_PRIVATE_DOMAIN},https://mcphub.${SECRET_PUBLIC_DOMAIN}
              BETTER_AUTH_OIDC_ENABLED: 'true'
              BETTER_AUTH_OIDC_PROVIDER_ID: authelia
              BETTER_AUTH_OIDC_DISCOVERY_URL: https://auth.${SECRET_PUBLIC_DOMAIN}/.well-known/openid-configuration
              BETTER_AUTH_OIDC_SCOPES: openid,profile,email,groups
              OIDC_CLIENT_ID: mcphub
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: OIDC_CLIENT_SECRET
              MCPHUB_SETTING_PATH: /data/mcp_settings.json
              INSTALL_BASE_URL: https://mcphub.${SECRET_PUBLIC_DOMAIN}
              ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: ADMIN_PASSWORD
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}
                    key: JWT_SECRET
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: app
        ports:
          http:
            port: &port 3000
    route:
      app-private:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: private
            sectionName: websecure-private
            namespace: networking
        hostnames:
          - mcphub.${SECRET_PRIVATE_DOMAIN}
        annotations:
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Tools
          gethomepage.dev/icon: mdi-hub
          gethomepage.dev/name: MCPHub
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 3000
      app-public:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - mcphub.${SECRET_PUBLIC_DOMAIN}
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 3000
