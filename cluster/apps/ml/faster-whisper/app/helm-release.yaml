---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
  namespace: ml
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    service:
      app:
        controller: app
        type: ClusterIP
        ports:
          wyoming:
            port: 10300
            protocol: TCP
    persistence:
      models:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: local-path
        retain: true
        globalMounts:
          - path: /models
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/custom-nvidia-gpu
                    operator: In
                    values:
                      - "true"
      runtimeClassName: nvidia
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/maksimkurb/wyoming-gigaam
              tag: "20260928171910"
              pullPolicy: Always
            env:
              TZ: "${TIMEZONE}"
              MODEL: gigaam-multilingual-ctc
              DEVICE: cuda
              MODEL_DIR: /opt/models/gigaam
              MODEL_CACHE_DIR: /models
              URI: tcp://0.0.0.0:10300
              FR_BATCH_SIZE: "1"
              FR_NUM_WORKERS: "0"
              LONGFORM_THRESHOLD_SECONDS: "25"
              OMP_NUM_THREADS: "2"
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,utility
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10300
                  initialDelaySeconds: 30
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                nvidia.com/gpu: "1"
              limits:
                cpu: 2000m
                memory: 4Gi
                nvidia.com/gpu: "1"
