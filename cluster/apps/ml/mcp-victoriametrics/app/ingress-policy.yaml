---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-victoriametrics-ingress
  namespace: ml
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - protocol: TCP
          port: 8080
