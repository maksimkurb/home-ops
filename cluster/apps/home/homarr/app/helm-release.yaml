---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/homarr-labs/homarr
              tag: v1.77.2
            env:
              TZ: ${TIMEZONE}
              PUID: "777"
              PGID: "777"
              AUTH_PROVIDERS: oidc
              AUTH_OIDC_ISSUER: https://auth.${SECRET_PUBLIC_DOMAIN}
              AUTH_OIDC_CLIENT_ID: homarr
              AUTH_OIDC_CLIENT_NAME: Authelia
              AUTH_OIDC_SCOPE_OVERWRITE: openid profile email groups homarr
              AUTH_OIDC_GROUPS_ATTRIBUTE: homarr_groups
              AUTH_OIDC_FORCE_USERINFO: "true"
              AUTH_OIDC_ENABLE_DANGEROUS_CREDENTIALS_LINKING: "true"
              AUTH_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: client_secret_basic
              AUTH_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-secret
                    key: AUTH_OIDC_CLIENT_SECRET
              SECRET_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-secret
                    key: SECRET_ENCRYPTION_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/live
                    port: 7575
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 7575
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
    service:
      main:
        controller: main
        ports:
          http:
            port: 7575
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - ${APP}.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 7575
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
    persistence:
      appdata:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        globalMounts:
          - path: /appdata
    defaultPodOptions:
      automountServiceAccountToken: false
