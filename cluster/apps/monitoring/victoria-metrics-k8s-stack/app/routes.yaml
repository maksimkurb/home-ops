apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmagent
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/group: Maintenance
    gethomepage.dev/icon: mdi-face-agent
    gethomepage.dev/name: VM Agent
spec:
  parentRefs:
    - name: private
      namespace: networking
      sectionName: websecure-private
  hostnames: ['vmagent.${SECRET_PRIVATE_DOMAIN}']
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: authelia, namespace: networking}
      backendRefs: [{name: vm-k8s-stack-vmagent, port: 8429}]
---
