---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: iperf-n8n-stats-dashboard
    files:
      - iperf-n8n-stats.json
    options:
      annotations:
        grafana_folder: Network
  - name: keen-pbr-dashboard
    files:
      - keen-pbr.json
    options:
      annotations:
        grafana_folder: Network
  - name: victorialogs-syslog-dashboard
    files:
      - victorialogs-syslog.json
    options:
      annotations:
        grafana_folder: Logs
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  labels:
    grafana_dashboard: "true"
