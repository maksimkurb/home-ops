---
# Register each protected domain in Authelia's traefik client as https://<domain>/_gateway-oidc/callback.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia-chain-monitoring
  namespace: flux-system
spec:
  interval: 30m
  path: ./cluster/apps/networking/traefik/authelia-chain
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-cluster
  targetNamespace: monitoring
  dependsOn:
    - name: traefik-crds
