---
apiVersion: v1
kind: Secret
metadata:
  name: remnawave
  namespace: oxygen
type: Opaque
stringData:
  # Remnawave only rejects the literal value "change_me".
  # Recommended: 64 random characters or more.
  # Example generator:
  #   openssl rand -base64 48 | tr -d '\n'
  APP_SECRET: "replace-with-at-least-64-random-characters-xxxxxxxxxxxxxxxxxxxxxxxx"

  # Remnawave requires a non-empty value.
  # Recommended: 32 random characters or more.
  # Example generator:
  #   openssl rand -base64 32 | tr -d '\n'
  METRICS_PASS: "replace-with-at-least-32-random-characters"
