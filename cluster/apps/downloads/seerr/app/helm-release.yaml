---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seerr
  namespace: downloads
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    global:
      nameOverride: *app
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
    route:
      main:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - seerr.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 80
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
          gethomepage.dev/enabled: 'true'
          gethomepage.dev/group: Media
          gethomepage.dev/weight: '-90'
          gethomepage.dev/icon: /icons/seerr/${HOMEPAGE_ICONS_COLOR}
          gethomepage.dev/name: Seerr
          gethomepage.dev/widget.type: jellyseerr
          gethomepage.dev/widget.url: http://seerr.downloads
          gethomepage.dev/widget.key: ${SECRET_HOMEPAGE_JELLYSEERR_API_KEY}
      redirect:
        enabled: true
        kind: HTTPRoute
        parentRefs:
          - name: public
            sectionName: websecure-public
            namespace: networking
        hostnames:
          - jellyseerr.${SECRET_PUBLIC_DOMAIN}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: 80
            filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: seerr-redirect
        annotations:
          external-dns.kubernetes.io/enabled: 'true'
          external-dns.kubernetes.io/target: ${INGRESS_DEFAULT}
          external-dns.kubernetes.io/cloudflare-proxied: ${quote}${INGRESS_DEFAULT_CF_PROXY}${quote}
    persistence:
      config:
        enabled: true
        existingClaim: seerr-config-v1
        globalMounts:
          - path: /app/config
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
    defaultPodOptions:
      securityContext:
        # Seerr upstream defaults to 1000:1000, but this cluster keeps app PVCs owned by 777:777.
        runAsUser: &uid 777
        runAsGroup: *uid
        fsGroup: *uid
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              PORT: 80
              DB_TYPE: postgres
              DB_HOST: homelab-pgsql.database.svc.cluster.local
              DB_PORT: '5432'
              DB_USER: seerr
              DB_NAME: seerr
              DB_LOG_QUERIES: 'false'
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 1m
                memory: 250Mi
              limits:
                memory: 1000Mi
