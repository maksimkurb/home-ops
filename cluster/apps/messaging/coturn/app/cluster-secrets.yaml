---
# Credentials rendered from cluster-secrets by Flux postBuild substitution.
# They live in a Secret (not inlined in ConfigMaps/HelmRelease values), so
# read access to non-Secret resources does not expose them.
apiVersion: v1
kind: Secret
metadata:
  name: coturn-cluster-secrets
type: Opaque
stringData:
  SECRET_COTURN_KEY: '${SECRET_COTURN_KEY}'
