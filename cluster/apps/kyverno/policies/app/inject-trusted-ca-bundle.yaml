---
# Injects the cleaned CA bundle (ConfigMap "trusted-ca-bundle", managed by trust-manager)
# into every container/initContainer of new Pods, so images need not be rebuilt.
# (Kyverno >= 1.20 no longer runs legacy ClusterPolicy, hence a CEL MutatingPolicy.)
#
# SCOPE: only pods running one of the images listed in variable "images" (repository, no tag/digest)
# in any namespace. Those images ship a CA store that still trusts the compromised emSign G3 roots.
# To cover another image, add its repository to "images" (see hack/ for scanning).
# OPT-OUT: label namespace OR pod (template) with  trusted-ca-bundle/skip: "true".
#
# Known limitations / pitfalls:
#  * Applies at Pod CREATE only: existing pods must be restarted.
#  * subPath mount over a path that is a DIRECTORY in the image fails (CreateContainerError);
#    use the skip label for such workloads. Missing parent dirs/files are created by the runtime;
#    symlinks (Alpine /etc/ssl/cert.pem) are resolved inside the rootfs.
#  * ConfigMap volume is optional, but a subPath of a missing key makes kubelet create a
#    directory there -> container start fails until the pod is recreated. Keep the Bundle healthy
#    before enabling (trust-manager creates the CM in each namespace, new namespaces may race).
#  * Containers that already mount any of the target paths (or /etc/ssl, /etc/pki, /etc/trust-bundle)
#    are skipped entirely. Env vars already set are never overridden.
#  * Static stores (Rust webpki-roots, Bun, Electron, Go x509roots/fallback, JVM with explicit
#    truststore flags) are NOT affected. See hack/verify-trusted-ca-bundle.sh.
#  * Java: JAVA_TOOL_OPTIONS makes JVMs print "Picked up JAVA_TOOL_OPTIONS" on stderr.
#  * Pods with the same-named volume "trusted-ca-bundle" skip volume injection only.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-trusted-ca-bundle
  annotations:
    policies.kyverno.io/title: Inject trusted CA bundle
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mounts the trust-manager cleaned CA bundle over the usual system CA bundle paths and sets
      SSL_CERT_FILE/SSL_CERT_DIR and friends, without rebuilding images.
spec:
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  webhookConfiguration:
    timeoutSeconds: 10
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchExpressions:
        - key: trusted-ca-bundle/skip
          operator: NotIn
          values: ["true"]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, cilium-secrets, kyverno]
    objectSelector:
      matchExpressions:
        - key: trusted-ca-bundle/skip
          operator: NotIn
          values: ["true"]
  matchConditions:
    - name: affected-image
      expression: >-
        object.spec.containers.exists(c, variables.images.exists(i, c.image.split('@')[0].split(':')[0] == i))
  variables:
    # Image repositories (as written in pod specs) whose CA store trusts the emSign G3 roots.
    - name: images
      expression: >-
        ['ghcr.io/maksimkurb/spilo-18', 'ghcr.io/zalando/postgres-operator',
        'ghcr.io/maksimkurb/frappe-kazip', 'kopia/kopia', 'ghcr.io/maksimkurb/scanservjs',
        'syncthing/syncthing', 'docker.io/pgsty/silo', 'ghcr.io/immich-app/immich-machine-learning',
        'oci.element.io/element-admin', 'oci.element.io/element-web',
        'docker.io/mumblevoip/mumble-server', 'ghcr.io/maksimkurb/wyoming-gigaam',
        'ghcr.io/ggml-org/llama.cpp', 'ghcr.io/victoriametrics/mcp-victorialogs',
        'ghcr.io/victoriametrics/mcp-victoriametrics', 'quay.io/kiwigrid/k8s-sidecar',
        'quay.io/prometheus/node-exporter', 'docker.io/authelia/authelia']
    # Containers already mounting any of these paths are skipped entirely.
    - name: skipPaths
      expression: >-
        ['/etc/ssl/certs/ca-certificates.crt', '/etc/ssl/cert.pem',
        '/etc/pki/tls/certs/ca-bundle.crt', '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem',
        '/etc/trust-bundle', '/etc/ssl/certs', '/etc/ssl', '/etc/pki', '/etc/pki/tls',
        '/etc/pki/tls/certs', '/etc/pki/ca-trust', '/etc/pki/ca-trust/extracted',
        '/etc/pki/ca-trust/extracted/pem']
    - name: envDefs
      expression: >-
        [{'name': 'SSL_CERT_FILE', 'value': '/etc/trust-bundle/ca-certificates.crt'},
        {'name': 'SSL_CERT_DIR', 'value': '/etc/trust-bundle'},
        {'name': 'REQUESTS_CA_BUNDLE', 'value': '/etc/trust-bundle/ca-certificates.crt'},
        {'name': 'CURL_CA_BUNDLE', 'value': '/etc/trust-bundle/ca-certificates.crt'},
        {'name': 'PIP_CERT', 'value': '/etc/trust-bundle/ca-certificates.crt'},
        {'name': 'NODE_OPTIONS', 'value': '--use-openssl-ca'},
        {'name': 'JAVA_TOOL_OPTIONS', 'value': '-Djavax.net.ssl.trustStore=/etc/trust-bundle/bundle.jks -Djavax.net.ssl.trustStorePassword=changeit'}]
    - name: hasVolume
      expression: >-
        object.spec.?volumes.orValue([]).exists(v, v.name == 'trusted-ca-bundle')
    - name: ctrs
      expression: >-
        object.spec.containers.filter(c,
        !c.?volumeMounts.orValue([]).exists(m, m.mountPath in variables.skipPaths))
    - name: inits
      expression: >-
        object.spec.?initContainers.orValue([]).filter(c,
        !c.?volumeMounts.orValue([]).exists(m, m.mountPath in variables.skipPaths))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: variables.hasVolume ? [] : [
                Object.spec.volumes{
                  name: 'trusted-ca-bundle',
                  configMap: Object.spec.volumes.configMap{
                    name: 'trusted-ca-bundle',
                    optional: true
                  }
                }
              ],
              containers: variables.ctrs.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [
                  Object.spec.containers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/ssl/certs/ca-certificates.crt', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.containers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/ssl/cert.pem', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.containers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/pki/tls/certs/ca-bundle.crt', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.containers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.containers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/trust-bundle', readOnly: true}
                ],
                env: variables.envDefs
                  .filter(e, !c.?env.orValue([]).exists(x, x.name == e.name))
                  .map(e, Object.spec.containers.env{name: e.name, value: e.value})
              }),
              initContainers: variables.inits.map(c, Object.spec.initContainers{
                name: c.name,
                volumeMounts: [
                  Object.spec.initContainers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/ssl/certs/ca-certificates.crt', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.initContainers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/ssl/cert.pem', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.initContainers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/pki/tls/certs/ca-bundle.crt', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.initContainers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem', subPath: 'ca-certificates.crt', readOnly: true},
                  Object.spec.initContainers.volumeMounts{name: 'trusted-ca-bundle', mountPath: '/etc/trust-bundle', readOnly: true}
                ],
                env: variables.envDefs
                  .filter(e, !c.?env.orValue([]).exists(x, x.name == e.name))
                  .map(e, Object.spec.initContainers.env{name: e.name, value: e.value})
              })
            }
          }
